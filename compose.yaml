services:
  ollama:
    image: ollama/ollama:0.34.3
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
    volumes:
      - ollama-models:/root/.ollama
    # No public port is necessary: the agent reaches this private Compose service.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      INTERRA_OLLAMA_URL: http://ollama:11434
      INTERRA_MODEL: qwen3-vl:2b
      INTERRA_TRACE_DIR: /app/artifacts/local-traces
    volumes:
      - perception-models:/models
      - ./artifacts:/app/artifacts
    depends_on:
      - ollama
volumes:
  ollama-models:
  perception-models:
