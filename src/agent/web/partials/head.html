<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap">
<link rel="stylesheet" href="/static/base.css">
<script>
  try {
    var saved = localStorage.getItem("interra-theme");
    var query = new URLSearchParams(location.search).get("theme");
    var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = query || saved || (light ? "light" : "dark");
  } catch (error) {
    document.documentElement.dataset.theme = "dark";
  }
</script>
